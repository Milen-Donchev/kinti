apiVersion: apps/v1
kind: Deployment
{{- $deployment := .Values.api.deployment | default dict }}
{{- $strategy := $deployment.strategy | default dict }}
metadata:
  name: {{ .Values.api.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ $deployment.revisionHistoryLimit | default 3 }}
  minReadySeconds: {{ $deployment.minReadySeconds | default 5 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $strategy.maxSurge | default 1 }}
      maxUnavailable: {{ $strategy.maxUnavailable | default 0 }}
  selector:
    matchLabels:
      app: {{ .Values.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.name }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
    {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          envFrom:
            - configMapRef:
                name: {{ .Values.api.name }}-config
            - secretRef:
                name: {{ .Values.api.name }}-secret
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
          resources:
{{- toYaml .Values.api.resources | nindent 12 }}
